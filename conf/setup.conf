# ============================================================
#  vps-setup 配置文件
#  每一项用 true / false 控制是否执行。改完保存后重新运行 setup.sh 即可。
# ============================================================

# ============================================================
#  ★ 你每次部署必做的核心步骤 ★
# ============================================================

# ---------- 1. swap 交换分区 ----------
SETUP_SWAP=true
# 方式：
#   native —— 内置自动创建（fallocate + fstab，全自动、无交互，推荐用于一键工具）
#   script —— 调用 zhucaidan/swap.sh 交互式脚本（和你在终端手动跑的一致，需手动输入）
# swap 大小：auto=按内存自动算（≤2G 内存→2×内存；2-4G→=内存；>4G→封顶4G）；
# 也可以写死，如 2G / 512M / 1G。
SWAP_SIZE="auto"
SWAP_METHOD="native"

# ---------- 2. BBR / BBRv3 网络优化 ----------
SETUP_BBR=true
# 方式：
#   native —— 原生 sysctl 启用 BBR+FQ，不安装第三方内核（推荐，默认）。
#             内核 ≥6.8（Ubuntu 24.04/Debian 12）自带 bbr 即 BBRv3，无需额外内核。
#   script —— 调用 byJoey Actions-bbr-v3 第三方脚本。
#             ⚠️ 会下载并安装未审计的自定义内核，存在供应链风险，仅在确需时手动开启。
BBR_METHOD="native"
# 仅 BBR_METHOD=script 时用到
BBR_SCRIPT_URL="https://raw.githubusercontent.com/byJoey/Actions-bbr-v3/main/install.sh"

# ---------- 3. 每天凌晨 4 点自动重启 ----------
# 等价于: (crontab -l 2>/dev/null; echo "0 4 * * * /sbin/shutdown -r now") | crontab -
SETUP_DAILY_REBOOT=true
# cron 表达式：默认每天凌晨 4 点
REBOOT_CRON="0 4 * * *"

# ---------- 4. SSH：从 GitHub 拉公钥 + 改端口 + 仅密钥登录 ----------
# 等价于: bash <(curl -fsSL s.sakari.top/key.sh) -og <用户名> -p 2222 -d
SETUP_SSH=true
# GitHub 用户名（从这里拉取公钥: https://github.com/<用户名>.keys）
# 默认留空，不带任何个人信息。交互运行时会提示输入；
# 若未输入或用户名拉不到公钥，将跳过 SSH 配置（不改端口、不禁密码），不影响其他模块。
SSH_GITHUB_USER=""
# 新的 SSH 端口
SSH_PORT="2222"
# true=仅保留 GitHub 公钥(等价 -o 覆盖)；false=追加到已有 authorized_keys
SSH_OVERWRITE_KEYS=true
# true=禁用密码登录，仅允许密钥(等价 -d)
SSH_DISABLE_PASSWORD=true

# ---------- 5. Zsh + Oh My Zsh + powerlevel10k 皮肤 ----------
INSTALL_ZSH=true
# 要启用的 zsh 插件（空格分隔）：
#   git/sudo/extract/command-not-found/systemd/docker/history 为 oh-my-zsh 内置，直接用名字
#   zsh-autosuggestions / zsh-syntax-highlighting / zsh-history-substring-search 会自动额外安装
#   按需增删，例如加 sudo、extract、systemd、docker 等
ZSH_PLUGINS="git zsh-autosuggestions zsh-syntax-highlighting zsh-history-substring-search"
# p10k 配置来源（默认使用内置通用配置，公开分享无个人信息）：
#   - 留空      → 使用内置通用 p10k 配置（跳过设置向导）
#   - 填 URL    → 从该地址拉取你自己的配置（例如 dotfiles 仓库直链）
#   - 填本地路径→ 复制服务器上的文件
#   - 或把你自己生成的 .p10k.zsh 放到 conf/p10k.zsh（已被 gitignore，不会提交到公共仓库）
# 无论哪种，安装后都会“应用配置并跳过 p10k 设置向导”。
P10K_CONFIG_URL=""
